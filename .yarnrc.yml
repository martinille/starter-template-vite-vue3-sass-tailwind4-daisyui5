nodeLinker: node-modules

# Minimum age (in minutes) a package version must have on the npm registry
# before Yarn is allowed to install it. 10080 minutes = 7 days.
#
# Good practice against supply-chain attacks: compromised or malicious releases
# (stolen maintainer tokens, injected post-install scripts, AI-generated
# backdoors slipped into a fresh version) are usually spotted and unpublished
# within hours. Waiting a week means the ecosystem does the QA for us and we
# never resolve to a version that was pulled the same day it appeared.
#
# Escape hatch: add a package to `npmPreapprovedPackages` to skip the gate,
# e.g. when a security patch has to land immediately.
npmMinimalAgeGate: 10080
