<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
	<link rel="icon" type="image/svg+xml" href="/vite.svg"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<meta name="description" content="Starter template with Vite, Vue 3, Sass, Tailwind CSS 4 and DaisyUI 5."/>
	<title>Starter template: Vite + Vue 3 + Sass + Tailwind 4 + DaisyUI 5</title>

	<!--
		Colours the browser UI on mobile. Two values so it follows the theme;
		keep them in sync with --color-base-100 in vendor/daisyui.css.
	-->
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
	<meta name="theme-color" content="#282e36" media="(prefers-color-scheme: dark)"/>

	<!--
		Link preview for social networks and chat apps. og:url and og:image have to
		be absolute URLs, so replace the domain below with your own after you copy
		this template - relative paths are silently ignored by most scrapers.
	-->
	<meta property="og:type" content="website"/>
	<meta property="og:site_name" content="Vite + Vue 3 + Sass + Tailwind 4 + DaisyUI 5"/>
	<meta property="og:title" content="Starter template: Vite + Vue 3 + Sass + Tailwind 4 + DaisyUI 5"/>
	<meta property="og:description" content="Starter template with Vite, Vue 3, Sass, Tailwind CSS 4 and DaisyUI 5."/>
	<meta property="og:url" content="https://tpl-vue3-tailwind4-daisyui5.brown.sk/"/>
	<meta property="og:image" content="https://tpl-vue3-tailwind4-daisyui5.brown.sk/template-image.png"/>
	<meta name="twitter:card" content="summary_large_image"/>

	<!--
		Applies the saved theme before the first paint, so the page never flashes
		the wrong colours while Vue is still booting. Keep this inline and keep it
		in <head> - moving it to a module or to the bottom of <body> brings the
		flash back.

		"system" is not a real DaisyUI theme, it means "follow the OS", so it is
		resolved to light/dark here. The rest of the theme handling (and the list
		of available themes) lives in src/utils/theme.js.
	-->
	<script>
		(function () {
			var saved;
			try {
				saved = localStorage.getItem('theme');
			} catch (e) {
				saved = null;
			}
			if (!saved || saved === 'system') {
				saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			document.documentElement.setAttribute('data-theme', saved);
		})();
	</script>
</head>
<body class="bg-base-100">
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
