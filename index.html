<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
	<link rel="icon" type="image/svg+xml" href="/vite.svg"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<meta name="description" content="Starter template with Vite, Vue 3, Sass, Tailwind CSS 4 and DaisyUI 5."/>
	<title>Starter template: Vite + Vue 3 + Sass + Tailwind 4 + DaisyUI 5</title>

	<script>
		(function () {
			var themes = ['system', 'light', 'dark', 'cupcake', 'retro', 'valentine', 'business', 'coffee', 'nord'];
			var saved;
			try {
				saved = localStorage.getItem('theme');
			} catch (e) {
				saved = null;
			}
			if (!saved || themes.indexOf(saved) === -1 || saved === 'system') {
				saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			document.documentElement.setAttribute('data-theme', saved);
		})();
	</script>
</head>
<body class="bg-base-100">
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
